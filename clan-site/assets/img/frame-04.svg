<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-label="Схема лица миньона">
  <rect width="640" height="420" fill="#FFFFFF"/>
  <g stroke="#EAEAE6" stroke-width="2">
    <path d="M0 40h640M0 80h640M0 120h640M0 160h640M0 200h640M0 240h640M0 280h640M0 320h640M0 360h640M0 400h640"/>
    <path d="M40 0v420M80 0v420M120 0v420M160 0v420M200 0v420M240 0v420M280 0v420M320 0v420M360 0v420M400 0v420M440 0v420M480 0v420M520 0v420M560 0v420M600 0v420"/>
  </g>

  <!-- пиксельная схема: лицо миньона по сетке 20px -->
  <g>
    <!-- волосы -->
    <g fill="#1A1C1F">
      <rect x="260" y="40" width="20" height="20"/><rect x="280" y="40" width="20" height="20"/>
      <rect x="300" y="20" width="20" height="20"/><rect x="320" y="20" width="20" height="20"/>
      <rect x="340" y="40" width="20" height="20"/><rect x="360" y="40" width="20" height="20"/>
    </g>
    <!-- голова -->
    <g fill="#F5C518">
      <rect x="200" y="60" width="240" height="20"/><rect x="180" y="80" width="280" height="20"/>
      <rect x="160" y="100" width="320" height="120"/><rect x="160" y="220" width="320" height="20"/>
      <rect x="180" y="240" width="280" height="20"/><rect x="200" y="260" width="240" height="20"/>
    </g>
    <g fill="#FFE45C">
      <rect x="200" y="80" width="80" height="20"/><rect x="360" y="80" width="80" height="20"/>
      <rect x="180" y="100" width="40" height="100"/>
    </g>
    <!-- повязка -->
    <g fill="#4A5158">
      <rect x="160" y="140" width="320" height="20"/>
      <rect x="140" y="120" width="20" height="60"/><rect x="480" y="120" width="20" height="60"/>
    </g>
    <!-- гогглы -->
    <g fill="#9AA3AB">
      <rect x="180" y="160" width="100" height="80"/><rect x="360" y="160" width="100" height="80"/>
    </g>
    <g fill="#F2F4F6">
      <rect x="200" y="180" width="60" height="40"/><rect x="380" y="180" width="60" height="40"/>
    </g>
    <g fill="#15181B">
      <rect x="220" y="190" width="20" height="20"/><rect x="400" y="190" width="20" height="20"/>
    </g>
    <!-- перемычка -->
    <g fill="#5C646C"><rect x="290" y="180" width="60" height="20"/></g>
    <!-- рот -->
    <g fill="#2A1A12">
      <rect x="240" y="260" width="160" height="20"/><rect x="260" y="280" width="120" height="20"/>
    </g>
    <g fill="#FFFFFF"><rect x="260" y="260" width="120" height="20"/></g>
    <!-- плечи -->
    <g fill="#3C78D8">
      <rect x="140" y="320" width="360" height="20"/><rect x="120" y="340" width="400" height="40"/>
    </g>
    <g fill="#F2C518">
      <rect x="180" y="330" width="20" height="20"/><rect x="440" y="330" width="20" height="20"/>
    </g>
  </g>

  <!-- размерные линии -->
  <g stroke="#050607" stroke-width="2" fill="none">
    <path d="M140 100v-40h20M500 100v-40h-20"/>
    <path d="M60 60h40M60 60v20M60 380h40M60 380v-20"/>
  </g>
  <g font-family="monospace" font-size="14" fill="#050607" letter-spacing="2">
    <text x="20" y="52">СЕТКА 20PX</text>
    <text x="486" y="46">ГОЛОВА</text>
    <text x="500" y="372">КОМБИНЕЗОН</text>
  </g>
</svg>
