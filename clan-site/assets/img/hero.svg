<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 900" width="720" height="900" role="img" aria-label="Миньон с повязкой">
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE45C"/>
      <stop offset=".55" stop-color="#F5C518"/>
      <stop offset="1" stop-color="#D9A50C"/>
    </linearGradient>
    <linearGradient id="denim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3C78D8"/>
      <stop offset="1" stop-color="#1E4C9C"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2F4F6"/>
      <stop offset=".5" stop-color="#9AA3AB"/>
      <stop offset="1" stop-color="#5C646C"/>
    </linearGradient>
    <linearGradient id="darkSteel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8A9299"/>
      <stop offset="1" stop-color="#3C4348"/>
    </linearGradient>
    <radialGradient id="eye" cx=".38" cy=".32" r=".8">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DCE2E7"/>
    </radialGradient>
  </defs>

  <!-- ============ ТЕЛО ============ -->
  <g>
    <!-- ноги -->
    <path d="M262 690 h84 v120 a26 26 0 0 1-26 26 h-32 a26 26 0 0 1-26-26 z" fill="url(#skin)" stroke="#1A1C1F" stroke-width="7"/>
    <path d="M374 690 h84 v120 a26 26 0 0 1-26 26 h-32 a26 26 0 0 1-26-26 z" fill="url(#skin)" stroke="#1A1C1F" stroke-width="7"/>
    <!-- ботинки -->
    <path d="M240 806 h108 a24 24 0 0 1 24 24 v18 a22 22 0 0 1-22 22 H240 a24 24 0 0 1-24-24 v-16 a24 24 0 0 1 24-24 z" fill="#2A2E33" stroke="#111416" stroke-width="7"/>
    <path d="M372 806 h108 a24 24 0 0 1 24 24 v18 a22 22 0 0 1-22 22 H372 a24 24 0 0 1-24-24 v-16 a24 24 0 0 1 24-24 z" fill="#2A2E33" stroke="#111416" stroke-width="7"/>

    <!-- корпус -->
    <path d="M228 250 h264 a56 56 0 0 1 56 56 v382 a56 56 0 0 1-56 56 H228 a56 56 0 0 1-56-56 V306 a56 56 0 0 1 56-56 z" fill="url(#skin)" stroke="#1A1C1F" stroke-width="8"/>

    <!-- комбинезон -->
    <path d="M228 452 h264 v236 a56 56 0 0 1-56 56 H228 a56 56 0 0 1-56-56 V508 a56 56 0 0 1 56-56 z" fill="url(#denim)" stroke="#1A1C1F" stroke-width="8"/>
    <path d="M262 452 h44 l-14 62 h-30 z" fill="#2A5FB8"/>
    <path d="M414 452 h-44 l14 62 h30 z" fill="#2A5FB8"/>
    <rect x="288" y="600" width="144" height="104" rx="16" fill="#2F68C8" stroke="#16336B" stroke-width="6"/>
    <path d="M288 620 h144" stroke="#16336B" stroke-width="5" stroke-dasharray="10 8"/>
    <circle cx="308" cy="546" r="11" fill="#F2C518" stroke="#1A1C1F" stroke-width="5"/>
    <circle cx="412" cy="546" r="11" fill="#F2C518" stroke="#1A1C1F" stroke-width="5"/>

    <!-- карман сзади -->
    <path d="M196 470 h44 v92 h-44 z" fill="#2A5FB8" stroke="#1A1C1F" stroke-width="6"/>

    <!-- руки -->
    <path d="M170 400 q-56 26 -66 84 q-6 34 18 44 q26 10 34-22 q10-38 44-56 z" fill="url(#skin)" stroke="#1A1C1F" stroke-width="8"/>
    <path d="M108 476 q-32 10 -34 42 q-2 26 24 28 q28 2 30-24 q2-24 20-32 z" fill="#2A2E33" stroke="#111416" stroke-width="7"/>
    <path d="M550 400 q56 26 66 84 q6 34-18 44 q-26 10-34-22 q-10-38-44-56 z" fill="url(#skin)" stroke="#1A1C1F" stroke-width="8"/>
    <path d="M612 476 q32 10 34 42 q2 26-24 28 q-28 2-30-24 q-2-24-20-32 z" fill="#2A2E33" stroke="#111416" stroke-width="7"/>

    <!-- шея -->
    <rect x="330" y="212" width="60" height="46" fill="url(#skin)" stroke="#1A1C1F" stroke-width="8"/>
  </g>

  <!-- ============ ГОЛОВА ============ -->
  <g>
    <ellipse cx="360" cy="146" rx="196" ry="132" fill="url(#skin)" stroke="#1A1C1F" stroke-width="8"/>

    <!-- волосы -->
    <g fill="#1A1C1F">
      <path d="M300 42 q6-40 26-30 q4 24 10 34 z"/>
      <path d="M340 26 q10-40 30-28 q0 26 4 36 z"/>
      <path d="M382 22 q16-36 34-20 q-8 24-12 32 z"/>
      <path d="M424 30 q22-30 34-8 q-14 20-20 26 z"/>
    </g>

    <!-- повязка -->
    <path d="M164 128 q196-42 392 0 v34 q-196-42-392 0 z" fill="url(#darkSteel)" stroke="#1A1C1F" stroke-width="7"/>
    <rect x="150" y="118" width="42" height="66" rx="12" fill="url(#steel)" stroke="#1A1C1F" stroke-width="7"/>
    <rect x="528" y="118" width="42" height="66" rx="12" fill="url(#steel)" stroke="#1A1C1F" stroke-width="7"/>

    <!-- гогглы -->
    <g>
      <circle cx="292" cy="168" r="62" fill="url(#steel)" stroke="#1A1C1F" stroke-width="8"/>
      <circle cx="292" cy="168" r="42" fill="url(#eye)" stroke="#2C3238" stroke-width="5"/>
      <ellipse cx="292" cy="172" rx="15" ry="17" fill="#15181B"/>
      <circle cx="285" cy="164" r="5" fill="#fff"/>
      <circle cx="428" cy="168" r="62" fill="url(#steel)" stroke="#1A1C1F" stroke-width="8"/>
      <circle cx="428" cy="168" r="42" fill="url(#eye)" stroke="#2C3238" stroke-width="5"/>
      <ellipse cx="428" cy="172" rx="15" ry="17" fill="#15181B"/>
      <circle cx="421" cy="164" r="5" fill="#fff"/>
      <rect x="344" y="150" width="32" height="16" rx="8" fill="url(#darkSteel)" stroke="#1A1C1F" stroke-width="5"/>
    </g>

    <!-- рот -->
    <path d="M286 232 q74 46 148 0 q-16 46-74 46 q-58 0-74-46 z" fill="#2A1A12" stroke="#1A1C1F" stroke-width="6"/>
    <path d="M312 240 q48 20 96 0 l-10 20 q-38 12-76 0 z" fill="#FFFFFF"/>
  </g>
</svg>
