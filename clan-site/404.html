<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 // SIGNAL LOST</title>
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@900&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#050607;color:#f4f6f7;
       font-family:"JetBrains Mono",monospace;text-align:center;padding:24px;position:relative;overflow:hidden}
  body::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(180deg,rgba(255,255,255,.03) 0 1px,transparent 1px 4px)}
  .box{position:relative;z-index:2;max-width:640px}
  .code{font-family:"Unbounded",Impact,sans-serif;font-weight:900;font-size:clamp(4rem,18vw,10rem);line-height:.85;
        color:transparent;-webkit-text-stroke:1.5px rgba(255,255,255,.55);margin:0 0 22px;letter-spacing:-.02em}
  .meta{font-size:10px;letter-spacing:.3em;color:#6a7178;text-transform:uppercase;margin:0 0 10px}
  p{color:#a4abb2;font-size:14px;line-height:2;margin:0 0 30px}
  a{display:inline-block;background:#050607;color:#fff;text-decoration:none;padding:16px 26px;font-size:11px;
    letter-spacing:.2em;text-transform:uppercase;clip-path:polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,8px 100%,0 calc(100% - 8px));
    transition:box-shadow .3s}
  a:hover{box-shadow:0 0 30px rgba(255,255,255,.25)}
  .line{width:100%;height:1px;background:rgba(255,255,255,.12);margin:26px 0}
</style></head>
<body>
  <div class="box">
    <p class="meta">ERROR 404 // SIGNAL LOST</p>
    <h1 class="code">404</h1>
    <p>Сектор не найден. Запрошенная страница вне зоны покрытия.<br>Вернитесь на главную и попробуйте снова.</p>
    <div class="line"></div>
    <a id="home" href="./">← На главную</a>
  </div>
</div>
<script>
  (function () {
    var seg = location.pathname.split("/").filter(Boolean);
    document.getElementById("home").href = "/" + (seg.length > 1 ? seg[0] + "/" : "");
  })();
</script>
</body>
</html>
